name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Release
        run: |
          xcodebuild -project DesktopTracker.xcodeproj \
            -scheme DesktopTracker \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Create DMG
        run: |
          APP_PATH=$(find build -name "DesktopTracker.app" -type d | head -1)
          hdiutil create -volname "DesktopTracker" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            DesktopTracker.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopTracker
          path: DesktopTracker.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesktopTracker

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: DesktopTracker.dmg
          generate_release_notes: true
